<div class="strumento grafico" data-grafico>
  <script type="application/json">{{ .Inner | safeJS }}</script>
  <noscript>Per vedere il grafico serve JavaScript attivo nel browser.</noscript>
</div>
{{- if not (.Page.Store.Get "comune-strumenti") }}
{{- .Page.Store.Set "comune-strumenti" true }}
<script src="{{ "js/strumenti/comune.js" | relURL }}" defer></script>
{{- end }}
{{- if not (.Page.Store.Get "grafico") }}
{{- .Page.Store.Set "grafico" true }}
<script src="{{ "js/strumenti/grafico.js" | relURL }}" defer></script>
{{- end }}
