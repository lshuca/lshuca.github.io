{{ define "head" }}
<link rel="stylesheet" href='{{ "css/single.css" | absURL }}'>
{{ end }}

{{ define "main" }}
<main id="main" class="post">
  {{ $indice := partial "indice.html" . }}
  {{ if and $indice (ne $indice.url .RelPermalink) }}
  <nav class="briciole"><a class="link" href="{{ $indice.url }}">← {{ $indice.nome }}</a></nav>
  {{ end }}
  <h1>{{ .Title }}</h1>
  {{ with .Params.sottotitolo }}<p class="sottotitolo">{{ . }}</p>{{ end }}
  <article class="content">
    {{ .Content }}
  </article>
</main>
{{ end }}
