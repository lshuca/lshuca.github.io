baseURL = "https://lshuca.github.io/"
locale = "it"
title = "La scienza ha un cuore antico"
theme = "hugo-theme-texify"

enableRobotsTXT = true
enableGitInfo = false
rssLimit = 10

[pagination]
    pagerSize = 10

[taxonomies]
    tags = "tags"

[markup]
    defaultMarkdownHandler = "goldmark"
[markup.goldmark.renderer]
    unsafe = true # html nel markdown
[markup.goldmark.extensions.passthrough]
    # formule passate intatte a katex
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
[markup.highlight]
    style = "emacs"

[[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
[[menus.main]]
    identifier = "dispense"
    name = "Dispense"
    pageRef = "/pages"
    weight = 2
[[menus.main]]
    identifier = "dispense-matematica"
    parent = "dispense"
    name = "Matematica"
    pageRef = "/pages/pymath/pymath"
    weight = 1
[[menus.main]]
    identifier = "dispense-fisica"
    parent = "dispense"
    name = "Fisica"
    pageRef = "/pages/pyphysics/pyphysics"
    weight = 2
[[menus.main]]
    identifier = "vademecum"
    name = "Vademecum"
    pageRef = "/vademecum"
    weight = 3
[[menus.main]]
    identifier = "vademecum-matematica"
    parent = "vademecum"
    name = "Matematica"
    pageRef = "/vademecum/matematica"
    weight = 1
[[menus.main]]
    identifier = "vademecum-fisica"
    parent = "vademecum"
    name = "Fisica"
    pageRef = "/vademecum/fisica"
    weight = 2
[[menus.main]]
    name = "Strumenti"
    pageRef = "/strumenti"
    weight = 4
[[menus.main]]
    name = "NNLC"
    pageRef = "/nnlc"
    weight = 5
    [menus.main.params]
        tendina = true # voci = pagine della sezione

[params]
    author = "Davide Barbieri"
    description = "Appunti, esercizi e strumenti interattivi di matematica e fisica - IIS Montessori Repetti"
    keywords = ["matematica", "fisica", "liceo", "appunti", "esercizi", "simulazioni"]
    favicon = "favicon.ico"
    footnote = "IIS Montessori Repetti"
    since = "2023"
    dateFormat = "02/01/2006"
    customCSS = ["css/sito.css"]
    customJS = []
    fullTextRSS = true
    emphasisWithDots = false
    toc = false

[params.math]
    enable = true
    use = "katex"

[params.outdated]
    enable = false

[params.giscus]
    enable = false

[params.utterances]
    enable = false
